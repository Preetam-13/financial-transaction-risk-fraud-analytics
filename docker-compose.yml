
services:
  postgres:
    image: postgres:16
    container_name: fraud-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fraud_analytics
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - fraud_analytics_data:/var/lib/postgresql/data

volumes:
  fraud_analytics_data:
